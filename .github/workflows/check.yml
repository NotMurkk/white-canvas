# Guards main: every pull request (including the ones the hosted map editor opens) and every push
# to main runs the tests, which include the committed-maps gate: each map in maps/ must be valid
# and carry a clear-check stamp that matches its gameplay.
name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Tests (maps, clear check, editor logic, app)
        run: npm test
      - name: Typecheck
        run: npm run typecheck
