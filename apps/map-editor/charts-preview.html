<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Charts preview</title>
    <!-- Dev-only page: WaveTimeline and BalancePanel with sample data (served by the editor's dev server). -->
    <style>
      html, body, #root { height: auto; min-height: 100%; }
      .pv { display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start; padding: 16px; }
      .pv-col { width: 380px; flex: none; }
      .pv-col > h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 0 0 8px; }
      .pv-col > h3 { font-size: 12px; color: var(--text); margin: 18px 0 6px; }
      .pv-panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: visible; }
      .pv-log { margin: 8px 0 0; padding: 8px; font: 11px ui-monospace, monospace; color: var(--muted); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; min-height: 40px; white-space: pre-wrap; }
      .pv .round.is-picked { border-color: var(--accent); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/charts-preview.tsx"></script>
  </body>
</html>
